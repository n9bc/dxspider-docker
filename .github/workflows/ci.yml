name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: stats-svc test suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stats-svc
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: stats-svc/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q
