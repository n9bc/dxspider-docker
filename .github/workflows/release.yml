name: Release images

# Build and publish the two custom images (dxspider, stats-svc) to the
# GitHub Container Registry (GHCR) when a version tag is pushed.
#
# Cut a release:
#   git tag v0.2.0
#   git push origin v0.2.0
#
# Published packages (public once the repo owner sets package visibility):
#   ghcr.io/n9bc/dxspider-docker/dxspider:0.2.0   (+ :0.2, :latest)
#   ghcr.io/n9bc/dxspider-docker/stats-svc:0.2.0  (+ :0.2, :latest)
#
# `workflow_dispatch` allows a manual run from the Actions tab without a
# tag (images are then tagged only with the branch/SHA metadata, not a
# semver — use a real tag for published releases).

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# GITHUB_TOKEN needs package write to push to GHCR; nothing else.
permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & push ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: dxspider
            context: ./dxspider
          - image: stats-svc
            context: ./stats-svc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Repo is already lowercase; GHCR requires lowercase paths.
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=dxspider-docker/${{ matrix.image }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          # ttyd ships an x86_64-only binary (see dxspider/Dockerfile); keep
          # the published images to linux/amd64 rather than ship a broken
          # arm64 variant. arm64 users build from source per the Dockerfile.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
